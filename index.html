<html>
<head>
<link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.3.1/css/all.css'>
<style>
*:focus {
  outline: none;
}

body {
  font-family: Helvetica, Arial;
  margin: 0;
  padding: 0;
  background-color: transparent;
  overflow: hidden;
}

#app-cover {
  position: relative;
  top: 90px;
  width: 430px;
  height: 100px;
  margin: 0 auto;
}

#bg-artwork {
  display: none;
  position: fixed;
  top: -30px;
  right: -30px;
  bottom: -30px;
  left: -30px;
  background-image: url("https://raw.githubusercontent.com/himalayasingh/music-player-1/master/img/_1.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: 50%;
  filter: blur(40px);
  -webkit-filter: blur(40px);
  z-index: 1;
}

#bg-layer {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: #fff;
  opacity: 0.51;
  z-index: 2;
}

#player {
  position: relative;
  height: 100%;
  z-index: 3;
}

#player-track {
  position: absolute;
  top: 0;
  right: 15px;
  left: 15px;
  padding: 13px 22px 10px 184px;
  background-color: #eeeeee;
  border-radius: 15px 15px 0 0;
  transition: 0.3s ease top;
  z-index: 1;
}

#player-track.active {
  top: -92px;
}

#album-name {
  color: #4a4a4a;
  font-size: 17px;
  font-weight: bold;
}

#track-name {
  color: #6a6a6a;
  font-size: 13px;
  margin: 2px 0 13px 0;
}

#track-time {
  height: 12px;
  margin-bottom: 3px;
  overflow: hidden;
}

#current-time {
  float: left;
}

#track-length {
  float: right;
}

#current-time,
#track-length {
  color: transparent;
  font-size: 11px;
  background-color: #dcdcdc;
  border-radius: 10px;
  transition: 0.3s ease all;
}

#track-time.active #current-time,
#track-time.active #track-length {
  color: #555555;
  background-color: transparent;
}

#s-area,
#seek-bar {
  position: relative;
  height: 4px;
  border-radius: 4px;
}

#s-area {
  background-color: #dcdcdc;
  cursor: pointer;
}

#ins-time {
  position: absolute;
  top: -29px;
  color: #fff;
  font-size: 12px;
  white-space: pre;
  padding: 5px 6px;
  border-radius: 4px;
  display: none;
}

#s-hover {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  opacity: 0.2;
  z-index: 2;
}

#ins-time {
  background-color: #e6e6e6;
  color: #666666;
}

#s-hover {
  background-color: #bdbdbd;
}

#seek-bar {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background-color: #777777;
  transition: 0.2s ease width;
  z-index: 1;
}

#player-content {
  position: relative;
  height: 100%;
  background-color: #fff;
  box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
  border-radius: 15px;
  z-index: 2;
}

#album-art {
  position: absolute;
  top: -40px;
  width: 115px;
  height: 115px;
  margin-left: 40px;
  transform: rotateZ(0);
  transition: 0.3s ease all;
  box-shadow: 0 0 0 10px #fff;
  border-radius: 50%;
  overflow: hidden;
}

#album-art.active {
  top: -60px;
  box-shadow: 0 0 0 4px #eeeeee, 0 30px 50px -15px #b5b5b5;
}

#album-art:before {
  content: "";
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  width: 20px;
  height: 20px;
  margin: -10px auto 0 auto;
  background-color: #d6dee7;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px #fff;
  z-index: 2;
}

#album-art img {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  z-index: -1;
}

#album-art img.active {
  opacity: 1;
  z-index: 1;
}

#album-art.active img.active {
  z-index: 1;
  animation: rotateAlbumArt 3s linear 0s infinite forwards;
}

@keyframes rotateAlbumArt {
  0% {
    transform: rotateZ(0);
  }
  100% {
    transform: rotateZ(360deg);
  }
}

#buffer-box {
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: 13px;
  color: #1f1f1f;
  font-size: 13px;
  font-family: Helvetica;
  text-align: center;
  font-weight: bold;
  line-height: 1;
  padding: 6px;
  margin: -12px auto 0 auto;
  background-color: rgba(255, 255, 255, 0.19);
  opacity: 0;
  z-index: 2;
}

#album-art img,
#buffer-box {
  transition: 0.1s linear all;
}

#album-art.buffering img {
  opacity: 0.25;
}

#album-art.buffering img.active {
  opacity: 0.8;
  filter: blur(2px);
  -webkit-filter: blur(2px);
}

#album-art.buffering #buffer-box {
  opacity: 1;
}

#player-controls {
  width: 250px;
  height: 100%;
  margin: 0 5px 0 141px;
  float: right;
  overflow: hidden;
}

.control {
  width: 33.333%;
  float: left;
  padding: 12px 0;
}

.button {
  width: 26px;
  height: 26px;
  padding: 25px;
  background-color: #fff;
  border-radius: 6px;
  cursor: pointer;
}

.button i {
  display: block;
  color: #d6dee7;
  font-size: 26px;
  text-align: center;
  line-height: 1;
}

.button,
.button i {
  transition: 0.2s ease all;
}

.button:hover {
  background-color: #d6d6de;
}

.button:hover i {
  color: #fff;
}



/* Local audio version */
#buffer-box {
  display: none !important;
}

#player-track {
  background-color: #eeeeee !important;
}
#album-name {
  color: #444444 !important;
}
#track-name {
  color: #666666 !important;
}
#current-time,
#track-length {
  background-color: #dcdcdc !important;
}
#track-time.active #current-time,
#track-time.active #track-length {
  color: #555555 !important;
  background-color: transparent !important;
}
#s-area {
  background-color: #dcdcdc !important;
}
#seek-bar {
  background-color: #777777 !important;
}
#ins-time {
  background-color: #e6e6e6 !important;
  color: #666666 !important;
}
#s-hover {
  background-color: #bdbdbd !important;
}
#album-art.active {
  box-shadow: 0 0 0 4px #eeeeee, 0 30px 50px -15px #b5b5b5 !important;
}

</style>
</head>
<body>
<div id="app-cover">
<div id="bg-artwork"></div>
<div id="bg-layer"></div>
<div id="player">
  <div id="player-track">
    <div id="album-name"></div>
    <div id="track-name"></div>
    <div id="track-time">
      <div id="current-time"></div>
      <div id="track-length"></div>
    </div>
    <div id="s-area">
      <div id="ins-time"></div>
      <div id="s-hover"></div>
      <div id="seek-bar"></div>
    </div>
  </div>
  <div id="player-content">
    <div id="album-art">
      <img src="./shigesada.jpg?v=6" class="active" id="_1" alt="Track 1">
      <img src="./kinggnu.jpg?v=6" id="_2" alt="Track 2">
      <img src="./vaundy.jpg?v=6" id="_3" alt="Track 3">
      <img src="./sakanaction.jpg?v=6" id="_4" alt="Track 4">
      <div id="buffer-box">Buffering ...</div>
    </div>
    <div id="player-controls">
      <div class="control">
        <div class="button" id="play-previous">
          <i class="fas fa-backward"></i>
        </div>
      </div>
      <div class="control">
        <div class="button" id="play-pause-button">
          <i class="fas fa-play"></i>
        </div>
      </div>
      <div class="control">
        <div class="button" id="play-next">
          <i class="fas fa-forward"></i>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script type="text/javascript" src="https://code.jquery.com/jquery-3.1.0.js"></script>


<script>
$(function () {
  var playerTrack = $("#player-track"),
      albumName = $("#album-name"),
      trackName = $("#track-name"),
      albumArt = $("#album-art"),
      sArea = $("#s-area"),
      seekBar = $("#seek-bar"),
      trackTime = $("#track-time"),
      insTime = $("#ins-time"),
      sHover = $("#s-hover"),
      playPauseButton = $("#play-pause-button"),
      icon = playPauseButton.find("i"),
      tProgress = $("#current-time"),
      tTime = $("#track-length"),
      playPreviousTrackButton = $("#play-previous"),
      playNextTrackButton = $("#play-next");

  var tracks = [
    { artist: "他人事の音がする", title: "重定", artwork: "_1", url: "./시게사다.mp3" },
    { artist: "白日", title: "King Gnu", artwork: "_2", url: "./백일.mp3" },
    { artist: "不可幸力", title: "Vaundy", artwork: "_3", url: "./불가행력.mp3" },
    { artist: "モス", title: "Sakanaction", artwork: "_4", url: "./모스.mp3" }
  ];

  var audio = new Audio();
  var currIndex = 0;
  var seekLoc = 0;
  var seekT = 0;

  function formatTime(seconds) {
    if (!isFinite(seconds) || seconds < 0) return "00:00";
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function updateTrackUI() {
    var track = tracks[currIndex];

    albumName.text(track.artist);
    trackName.text(track.title);

    albumArt.find("img.active").removeClass("active");
    $("#" + track.artwork).addClass("active");

    seekBar.width(0);
    tProgress.text("00:00");
    tTime.text("00:00");
    trackTime.removeClass("active");
  }

  function loadTrack(index, autoplay) {
    currIndex = (index + tracks.length) % tracks.length;
    var track = tracks[currIndex];

    audio.src = track.url;
    audio.load();
    updateTrackUI();

    if (autoplay) {
      audio.play().catch(function () {});
    }
  }

  function setPlayingUI(playing) {
    if (playing) {
      playerTrack.addClass("active");
      albumArt.addClass("active");
      icon.attr("class", "fas fa-pause");
    } else {
      playerTrack.removeClass("active");
      albumArt.removeClass("active");
      icon.attr("class", "fas fa-play");
    }
  }

  function playPause() {
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  }

  function updateCurrTime() {
    var current = audio.currentTime || 0;
    var duration = audio.duration || 0;

    tProgress.text(formatTime(current));
    tTime.text(formatTime(duration));

    if (duration > 0) {
      trackTime.addClass("active");
      seekBar.width((current / duration) * 100 + "%");
    } else {
      trackTime.removeClass("active");
    }
  }

  function showHover(event) {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;

    var pos = sArea.offset();
    seekT = event.clientX - pos.left;
    seekT = Math.max(0, Math.min(seekT, sArea.outerWidth()));
    seekLoc = audio.duration * (seekT / sArea.outerWidth());

    sHover.width(seekT);
    insTime
      .text(formatTime(seekLoc))
      .css({ left: seekT, "margin-left": "-21px" })
      .fadeIn(0);
  }

  function hideHover() {
    sHover.width(0);
    insTime
      .text("00:00")
      .css({ left: "0px", "margin-left": "0px" })
      .fadeOut(0);
  }

  function playFromClickedPos(event) {
    if (!isFinite(audio.duration) || audio.duration <= 0) return;

    var pos = sArea.offset();
    var x = event.clientX - pos.left;
    x = Math.max(0, Math.min(x, sArea.outerWidth()));
    audio.currentTime = audio.duration * (x / sArea.outerWidth());
    hideHover();
  }

  playPauseButton.on("click", playPause);

  playPreviousTrackButton.on("click", function () {
    loadTrack(currIndex - 1, true);
  });

  playNextTrackButton.on("click", function () {
    loadTrack(currIndex + 1, true);
  });

  sArea.mousemove(showHover);
  sArea.mouseout(hideHover);
  sArea.on("click", playFromClickedPos);

  $(audio).on("play", function () {
    setPlayingUI(true);
  });

  $(audio).on("pause", function () {
    setPlayingUI(false);
  });

  $(audio).on("timeupdate", updateCurrTime);

  $(audio).on("loadedmetadata", updateCurrTime);

  $(audio).on("ended", function () {
    loadTrack(currIndex + 1, true);
  });

  loadTrack(0, false);
});
</script>


</body>
</html>
