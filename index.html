<html>
<head>
<link rel='stylesheet' href='https://use.fontawesome.com/releases/v5.3.1/css/all.css'>
<style>
*:focus {
  outline: none;
}

body {
  font-family: Helvetica, Arial;
  margin: 0;
  padding: 0;
  background-color: transparent;
  overflow: hidden;
}

#app-cover {
  position: relative;
  top: 90px;
  width: 430px;
  height: 100px;
  margin: 0 auto;
}

#bg-artwork {
  display: none;
  position: fixed;
  top: -30px;
  right: -30px;
  bottom: -30px;
  left: -30px;
  background-image: url("https://raw.githubusercontent.com/himalayasingh/music-player-1/master/img/_1.jpg");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: 50%;
  filter: blur(40px);
  -webkit-filter: blur(40px);
  z-index: 1;
}

#bg-layer {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: #fff;
  opacity: 0.51;
  z-index: 2;
}

#player {
  position: relative;
  height: 100%;
  z-index: 3;
}

#player-track {
  position: absolute;
  top: 0;
  right: 15px;
  left: 15px;
  padding: 13px 22px 10px 184px;
  background-color: #eeeeee;
  border-radius: 15px 15px 0 0;
  transition: 0.3s ease top;
  z-index: 1;
}

#player-track.active {
  top: -92px;
}

#album-name {
  color: #4a4a4a;
  font-size: 17px;
  font-weight: bold;
}

#track-name {
  color: #6a6a6a;
  font-size: 13px;
  margin: 2px 0 13px 0;
}

#track-time {
  height: 12px;
  margin-bottom: 3px;
  overflow: hidden;
}

#current-time {
  float: left;
}

#track-length {
  float: right;
}

#current-time,
#track-length {
  color: transparent;
  font-size: 11px;
  background-color: #dcdcdc;
  border-radius: 10px;
  transition: 0.3s ease all;
}

#track-time.active #current-time,
#track-time.active #track-length {
  color: #555555;
  background-color: transparent;
}

#s-area,
#seek-bar {
  position: relative;
  height: 4px;
  border-radius: 4px;
}

#s-area {
  background-color: #dcdcdc;
  cursor: pointer;
}

#ins-time {
  position: absolute;
  top: -29px;
  color: #fff;
  font-size: 12px;
  white-space: pre;
  padding: 5px 6px;
  border-radius: 4px;
  display: none;
}

#s-hover {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  opacity: 0.2;
  z-index: 2;
}

#ins-time {
  background-color: #e6e6e6;
  color: #666666;
}

#s-hover {
  background-color: #bdbdbd;
}

#seek-bar {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 0;
  background-color: #777777;
  transition: 0.2s ease width;
  z-index: 1;
}

#player-content {
  position: relative;
  height: 100%;
  background-color: #fff;
  box-shadow: 0 30px 80px #656565;
  border-radius: 15px;
  z-index: 2;
}

#album-art {
  position: absolute;
  top: -40px;
  width: 115px;
  height: 115px;
  margin-left: 40px;
  transform: rotateZ(0);
  transition: 0.3s ease all;
  box-shadow: 0 0 0 10px #fff;
  border-radius: 50%;
  overflow: hidden;
}

#album-art.active {
  top: -60px;
  box-shadow: 0 0 0 4px #eeeeee, 0 30px 50px -15px #b5b5b5;
}

#album-art:before {
  content: "";
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  width: 20px;
  height: 20px;
  margin: -10px auto 0 auto;
  background-color: #d6dee7;
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px #fff;
  z-index: 2;
}

#album-art img {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  z-index: -1;
}

#album-art img.active {
  opacity: 1;
  z-index: 1;
}

#album-art.active img.active {
  z-index: 1;
  animation: rotateAlbumArt 3s linear 0s infinite forwards;
}

@keyframes rotateAlbumArt {
  0% {
    transform: rotateZ(0);
  }
  100% {
    transform: rotateZ(360deg);
  }
}

#buffer-box {
  position: absolute;
  top: 50%;
  right: 0;
  left: 0;
  height: 13px;
  color: #1f1f1f;
  font-size: 13px;
  font-family: Helvetica;
  text-align: center;
  font-weight: bold;
  line-height: 1;
  padding: 6px;
  margin: -12px auto 0 auto;
  background-color: rgba(255, 255, 255, 0.19);
  opacity: 0;
  z-index: 2;
}

#album-art img,
#buffer-box {
  transition: 0.1s linear all;
}

#album-art.buffering img {
  opacity: 0.25;
}

#album-art.buffering img.active {
  opacity: 0.8;
  filter: blur(2px);
  -webkit-filter: blur(2px);
}

#album-art.buffering #buffer-box {
  opacity: 1;
}

#player-controls {
  width: 250px;
  height: 100%;
  margin: 0 5px 0 141px;
  float: right;
  overflow: hidden;
}

.control {
  width: 33.333%;
  float: left;
  padding: 12px 0;
}

.button {
  width: 26px;
  height: 26px;
  padding: 25px;
  background-color: #fff;
  border-radius: 6px;
  cursor: pointer;
}

.button i {
  display: block;
  color: #d6dee7;
  font-size: 26px;
  text-align: center;
  line-height: 1;
}

.button,
.button i {
  transition: 0.2s ease all;
}

.button:hover {
  background-color: #d6d6de;
}

.button:hover i {
  color: #fff;
}



#spotify-embed {
  position: absolute;
  width: 430px;
  height: 152px;
  left: 0;
  top: 0;
  opacity: 0.001;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

#buffer-box {
  display: none !important;
}

/* Final monochrome overrides */
#player-track {
  background-color: #eeeeee !important;
}
#album-name {
  color: #444444 !important;
}
#track-name {
  color: #666666 !important;
}
#current-time,
#track-length {
  background-color: #dcdcdc !important;
}
#track-time.active #current-time,
#track-time.active #track-length {
  color: #555555 !important;
  background-color: transparent !important;
}
#s-area {
  background-color: #dcdcdc !important;
}
#seek-bar {
  background-color: #777777 !important;
}
#ins-time {
  background-color: #e6e6e6 !important;
  color: #666666 !important;
}
#s-hover {
  background-color: #bdbdbd !important;
}
#album-art.active {
  box-shadow: 0 0 0 4px #eeeeee, 0 30px 50px -15px #b5b5b5 !important;
}

</style>
</head>
<body>
<div id="app-cover">
<div id="spotify-embed"></div>
<div id="bg-artwork"></div>
<div id="bg-layer"></div>
<div id="player">
  <div id="player-track">
    <div id="album-name"></div>
    <div id="track-name"></div>
    <div id="track-time">
      <div id="current-time"></div>
      <div id="track-length"></div>
    </div>
    <div id="s-area">
      <div id="ins-time"></div>
      <div id="s-hover"></div>
      <div id="seek-bar"></div>
    </div>
  </div>
  <div id="player-content">
    <div id="album-art">
      <img src="./shigesada.jpg?v=4" class="active" id="_1" alt="시게사다">
      <img src="./kinggnu.jpg?v=4" id="_2" alt="King Gnu">
      <img src="./vaundy.jpg?v=4" id="_3" alt="Vaundy">
      <img src="./sakanaction.jpg?v=4" id="_4" alt="사카낙션">
      <div id="buffer-box">Buffering ...</div>
    </div>
    <div id="player-controls">
      <div class="control">
        <div class="button" id="play-previous">
          <i class="fas fa-backward"></i>
        </div>
      </div>
      <div class="control">
        <div class="button" id="play-pause-button">
          <i class="fas fa-play"></i>
        </div>
      </div>
      <div class="control">
        <div class="button" id="play-next">
          <i class="fas fa-forward"></i>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script type="text/javascript" src="https://code.jquery.com/jquery-3.1.0.js"></script>


<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
<script type="text/javascript">
var embedController = null;
var currIndex = 0;
var isPaused = true;
var progressTimer = null;
var lastPlayback = {
  position: 0,
  duration: 0,
  isPaused: true
};

var tracks = [
  {
    artist: "시게사다",
    title: "남의 일 소리가 나",
    uri: "spotify:track:4HRcAmACG7oIVPXZq31CSm",
    artwork: "_1"
  },
  {
    artist: "King Gnu",
    title: "백일",
    uri: "spotify:track:172fMG26G2OoEzzg0wn26r",
    artwork: "_2"
  },
  {
    artist: "Vaundy",
    title: "불가행력",
    uri: "spotify:track:24ntZeyCrVePmN3nUYhfLx",
    artwork: "_3"
  },
  {
    artist: "사카낙션",
    title: "모스",
    uri: "spotify:track:4FdpXwtpJfRltvFuTcpNL6",
    artwork: "_4"
  }
];

function formatTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return "00:00";
  var m = Math.floor(seconds / 60);
  var s = Math.floor(seconds % 60);
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

function updateTrackUI() {
  var track = tracks[currIndex];

  $("#album-name").text(track.artist);
  $("#track-name").text(track.title);

  $("#album-art img.active").removeClass("active");
  $("#" + track.artwork).addClass("active");

  $("#seek-bar").width(0);
  $("#current-time").text("00:00");
  $("#track-length").text("00:00");
  $("#track-time").removeClass("active");
}

function setPlayingUI(playing) {
  if (playing) {
    $("#player-track").addClass("active");
    $("#album-art").addClass("active");
    $("#play-pause-button i").attr("class", "fas fa-pause");
  } else {
    $("#player-track").removeClass("active");
    $("#album-art").removeClass("active");
    $("#play-pause-button i").attr("class", "fas fa-play");
  }
}

function loadTrack(index, autoplay) {
  currIndex = (index + tracks.length) % tracks.length;
  updateTrackUI();

  if (!embedController) return;

  embedController.loadEntity(tracks[currIndex].uri);
  isPaused = true;
  setPlayingUI(false);

  if (autoplay) {
    setTimeout(function () {
      embedController.play();
    }, 350);
  }
}

function playPause() {
  if (!embedController) return;
  embedController.togglePlay();
}

function updateProgressFromState(data) {
  if (!data) return;

  lastPlayback.position = data.position || 0;
  lastPlayback.duration = data.duration || 0;
  lastPlayback.isPaused = !!data.isPaused;
  isPaused = !!data.isPaused;

  var currentSec = lastPlayback.position / 1000;
  var durationSec = lastPlayback.duration / 1000;

  $("#current-time").text(formatTime(currentSec));
  $("#track-length").text(formatTime(durationSec));

  if (durationSec > 0) {
    $("#track-time").addClass("active");
    $("#seek-bar").width((currentSec / durationSec) * 100 + "%");
  }

  setPlayingUI(!isPaused);
}

window.onSpotifyIframeApiReady = function(IFrameAPI) {
  var element = document.getElementById("spotify-embed");
  var options = {
    width: 430,
    height: 152,
    uri: tracks[0].uri
  };

  IFrameAPI.createController(element, options, function(controller) {
    embedController = controller;
    updateTrackUI();

    controller.addListener("ready", function() {
      updateTrackUI();
    });

    controller.addListener("playback_started", function() {
      setPlayingUI(true);
    });

    controller.addListener("playback_update", function(e) {
      updateProgressFromState(e.data);
    });
  });
};

$(function () {
  updateTrackUI();

  $("#play-pause-button").on("click", playPause);

  $("#play-previous").on("click", function () {
    loadTrack(currIndex - 1, true);
  });

  $("#play-next").on("click", function () {
    loadTrack(currIndex + 1, true);
  });

  $("#s-area").mousemove(function(event) {
    var durationSec = lastPlayback.duration / 1000;
    if (!durationSec) return;

    var sArea = $("#s-area");
    var pos = sArea.offset();
    var seekT = event.clientX - pos.left;
    seekT = Math.max(0, Math.min(seekT, sArea.outerWidth()));
    var seekLoc = durationSec * (seekT / sArea.outerWidth());

    $("#s-hover").width(seekT);
    $("#ins-time")
      .text(formatTime(seekLoc))
      .css({ left: seekT, "margin-left": "-21px" })
      .fadeIn(0);
  });

  $("#s-area").mouseout(function() {
    $("#s-hover").width(0);
    $("#ins-time")
      .text("00:00")
      .css({ left: "0px", "margin-left": "0px" })
      .fadeOut(0);
  });

  $("#s-area").on("click", function(event) {
    if (!embedController || !lastPlayback.duration) return;

    var sArea = $("#s-area");
    var pos = sArea.offset();
    var seekT = event.clientX - pos.left;
    seekT = Math.max(0, Math.min(seekT, sArea.outerWidth()));

    var seekSec = (lastPlayback.duration / 1000) *
                  (seekT / sArea.outerWidth());

    embedController.seek(Math.floor(seekSec));
  });
});
</script>


</body>
</html>
